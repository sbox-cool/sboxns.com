name: Regenerate docs
# Rebuilds every curated, commit-pinned server/library documentation snapshot.
# Publication mappings are reviewed in tools/docs/versions.json, never inferred from .version.
# Commits link-checked output directly and requests a Pages build.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/docs/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release-reconcile.yml'
      - '.github/workflows/certify-native.yml'
      - 'tools/native-certification/**'
      - 'tools/compatibility/**'
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: regenerate-docs-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100
      - name: Build
        working-directory: tools/docs
        run: |
          npm ci
          npm run track:revisions
          node versions.mjs
          node check-links.mjs
          npm test
          dotnet run --project ../compatibility/ContractInspector -- --self-test
      - name: Commit and publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs sitemap.xml llms.txt tools/docs/sbox-revisions.json; then
            echo "Docs are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs sitemap.xml llms.txt tools/docs/sbox-revisions.json
          git commit -m "Regenerate docs from $(jq -r '.server.ref + " / library " + .library.ref' docs/sources.json)"
          git push origin HEAD:main
          # Pushes made with GITHUB_TOKEN do not trigger the Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null

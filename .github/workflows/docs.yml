name: Regenerate docs
# Rebuilds /docs/ from the server (latest release by default) and the library (main by default),
# and commits the link-checked output to main when it changes. The organization does not allow
# Actions to open pull requests, so the build commits directly and requests a Pages build.
on:
  workflow_dispatch:
    inputs:
      server_ref:
        description: Server ref (latest = newest vX.Y.Z tag)
        default: latest
      library_ref:
        description: Library ref
        default: main
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: regenerate-docs
  cancel-in-progress: false
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: tools/docs
        run: |
          npm ci
          node build.mjs --server-ref "${{ inputs.server_ref || 'latest' }}" --library-ref "${{ inputs.library_ref || 'main' }}"
          node check-links.mjs
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs sitemap.xml llms.txt; then
            echo "Docs are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs sitemap.xml llms.txt
          git commit -m "Regenerate docs from $(jq -r '.server.ref + " / library " + .library.ref' docs/sources.json)"
          git push origin HEAD:main
          # Pushes made with GITHUB_TOKEN do not trigger the Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null

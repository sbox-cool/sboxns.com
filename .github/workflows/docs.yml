name: Regenerate docs
# Rebuilds /docs/ from the server (latest release by default) and the library (main by default)
# and opens or updates a pull request when the generated pages change.
on:
  workflow_dispatch:
    inputs:
      server_ref:
        description: Server ref (latest = newest vX.Y.Z tag)
        default: latest
      library_ref:
        description: Library ref
        default: main
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: regenerate-docs
  cancel-in-progress: false
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: tools/docs
        run: |
          npm ci
          node build.mjs --server-ref "${{ inputs.server_ref || 'latest' }}" --library-ref "${{ inputs.library_ref || 'main' }}"
          node check-links.mjs
      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs sitemap.xml llms.txt; then
            echo "Docs are up to date."
            exit 0
          fi
          branch=docs/regenerate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add docs sitemap.xml llms.txt
          git commit -m "Regenerate docs from $(jq -r '.server.ref + " / library " + .library.ref' docs/sources.json)"
          git push --force origin "$branch"
          if ! gh pr view "$branch" > /dev/null 2>&1; then
            gh pr create --head "$branch" --base main --title "Regenerate docs" \
              --body "Generated by the Regenerate docs workflow. Sources: $(jq -c . docs/sources.json)"
          fi

name: Bust asset caches
# Rewrites content-hash ?v= URLs (tools/cache-bust.mjs) so a release busts browser and
# CDN caches. Shared header/footer partials are injected first
# (tools/build-pages.mjs), so embedded asset URLs get fresh hashes too.
# Pushes made with GITHUB_TOKEN never trigger this; the docs regen runs the
# same script before committing instead (see docs.yml).
on:
  push:
    branches: [main]
    paths:
      - '**.css'
      - '**.js'
      - '**.json'
      - 'images/**'
      - 'privacy/**'
      - 'contact/**'
      - '404.html'
      - 'partials/**'
      - 'tools/build-pages.mjs'
      - '.github/workflows/cache-bust.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: cache-bust
  cancel-in-progress: false
jobs:
  bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build shared pages
        run: node tools/build-pages.mjs
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Caches already busted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html install privacy contact 404.html partials docs discord-invite tools/build-pages.mjs
          if git diff --cached --quiet; then
            echo "Unexpected files changed; leaving for a human:"
            git status --short
            exit 1
          fi
          git commit -m "Bust asset caches"
          for i in 1 2 3; do
            if git pull --rebase --quiet origin main && git push --quiet origin HEAD:main; then
              break
            fi
            git rebase --abort || true
            if [ "$i" = 3 ]; then echo "Push raced; rerun the workflow."; exit 1; fi
            sleep 10
          done
          # Pushes made with GITHUB_TOKEN do not trigger the Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null
